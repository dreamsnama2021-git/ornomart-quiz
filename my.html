<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Ornomart Coupons</title>
<link rel="icon" href="emblem.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  /* Layout: centred lookup card (like admin login); after lookup, a player header, three summary tiles and a list of coupon tickets. White Ornomart theme. */
  @font-face { font-family: "Armoresa Aged"; src: local("Armoresa Aged"), local("ArmoresaAged"), local("Armoresa-Aged"); }
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --tint: #f3f6fc;
    --surface: #ffffff;
    --ink: #1b1f4b;
    --muted: #5a6087;
    --line: #dde3f0;
    --accent: #0066cc;
    --accent-soft: #eaf2fc;
    --primary: #00308a;
    --ok: #1d7a4f;
    --ok-soft: #e6f5ec;
    --bad: #c0282d;
    --bad-soft: #fdecec;
    --font-display: "Cinzel", "Trajan Pro", "Times New Roman", serif;
    --font-accent: "Armoresa Aged", "Cinzel Decorative", "Cinzel", serif;
    --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  img { max-width: 100%; }
  body { margin: 0; background: var(--tint); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
  .wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: flex; flex-direction: column; gap: 18px; }
  .wrap.centered { min-height: 100vh; min-height: 100dvh; justify-content: center; align-items: center; padding-block: 24px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 14px; min-width: 0; box-shadow: 0 10px 30px -18px rgba(0,48,138,.28); }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0; color: var(--primary); letter-spacing: .02em; }
  h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
  label { font-family: var(--font-display); font-weight: 600; font-size: 12.5px; letter-spacing: .03em; }
  input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button, .btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 999px; padding: 11px 20px; border: 1px solid transparent; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: var(--surface); }
  .btn-ghost { background: var(--surface); color: var(--primary); border-color: var(--line); }
  .btn-small { padding: 6px 14px; font-size: 13px; }
  button:disabled { opacity: .55; cursor: default; }
  .btn-google { background: var(--surface); color: var(--ink); border-color: var(--line); width: 100%; }
  .btn-google svg { width: 18px; height: 18px; flex: none; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .note { color: var(--muted); font-size: 13px; margin: 0; }
  .msg { font-size: 13px; margin: 0; color: var(--bad); min-height: 1.2em; }

  /* Lookup card */
  .lookup { max-width: 400px; width: 100%; }
  .lookup img { width: 140px; height: auto; display: block; margin: 0 auto; }
  .lookup h1 { text-align: center; }
  .lookup .note { text-align: center; }

  /* Header after lookup */
  .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .head img { width: 48px; height: 48px; }
  .head .titles { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .head .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 520px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tile .k { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1.2; }

  /* Coupon tickets */
  .tickets { display: flex; flex-direction: column; gap: 12px; }
  .ticket { position: relative; overflow: hidden; display: grid; grid-template-columns: 120px 1fr; border: 2px dashed var(--accent); border-radius: 16px; background: var(--accent-soft); }
  .ticket.used, .ticket.expired { border-color: var(--line); background: var(--surface); }
  .ticket .off { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 8px; border-right: 2px dashed var(--accent); text-align: center; }
  .ticket.used .off, .ticket.expired .off { border-right-color: var(--line); }
  .ticket .off strong { font-family: var(--font-accent); font-size: 30px; line-height: 1; color: var(--accent); }
  .ticket.used .off strong, .ticket.expired .off strong { color: var(--muted); }
  .ticket .off span { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .ticket .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .ticket .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .code { font-family: ui-monospace, Consolas, monospace; font-weight: 700; font-size: 17px; letter-spacing: .1em; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; user-select: all; }
  .meta { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 700; }
  .pill.active { background: var(--accent); color: var(--surface); }
  .pill.used { background: var(--ok-soft); color: var(--ok); }
  .pill.expired { background: var(--bad-soft); color: var(--bad); }
  .ticket::after { content: ""; position: absolute; right: -30px; bottom: -30px; width: 120px; height: 120px; background: url(emblem.png) center/contain no-repeat; opacity: .08; pointer-events: none; }
  @media (max-width: 480px) { .ticket { grid-template-columns: 92px 1fr; } .ticket .off strong { font-size: 24px; } }

  .empty { text-align: center; padding: 28px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
</style>
</head>
<body>
<div class="wrap centered" id="wrap">

  <!-- Lookup -->
  <section class="panel lookup" id="lookupView">
    <img src="logo.png" alt="Ornomart" width="560" height="372">
    <h1>My Coupons</h1>
    <p class="note">See your quiz scores and all your Ornomart coupons.</p>
    <div id="googleBox" hidden style="display:flex;flex-direction:column;gap:14px">
      <button type="button" class="btn btn-google" id="googleBtn"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg><span>Continue with Google</span></button>
      <div class="divider">or use your mobile and name</div>
    </div>
    <form id="lookupForm" style="display:flex;flex-direction:column;gap:12px" novalidate>
      <div class="field">
        <label for="name">Full Name</label>
        <input id="name" autocomplete="name" placeholder="As entered in the quiz">
      </div>
      <div class="field">
        <label for="phone">Mobile Number</label>
        <input id="phone" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10 digit number">
      </div>
      <button type="submit" class="btn btn-primary" id="lookupBtn">Show My Coupons</button>
      <p class="msg" id="lookupMsg" role="alert"></p>
    </form>
    <a class="btn btn-ghost" href="./">Play the Quiz</a>
  </section>

  <!-- Dashboard -->
  <div id="dashView" hidden style="display:flex;flex-direction:column;gap:18px;width:100%">
    <header class="head">
      <img src="emblem.png" alt="">
      <div class="titles">
        <h1 id="hello">My Coupons</h1>
        <span class="sub" id="who"></span>
      </div>
      <a class="btn btn-primary btn-small" href="./">Play Again</a>
      <button type="button" class="btn btn-ghost btn-small" id="exitBtn">Sign Out</button>
    </header>

    <section class="tiles" aria-label="Summary">
      <div class="tile"><span class="k">Quizzes</span><span class="v" id="tPlayed">0</span></div>
      <div class="tile"><span class="k">Best score</span><span class="v" id="tBest">0/10</span></div>
      <div class="tile"><span class="k">Active coupons</span><span class="v" id="tActive">0</span></div>
    </section>

    <section class="panel">
      <h2>Your Coupons</h2>
      <p class="note">Show an active coupon code at the Ornomart store. Each coupon is valid for 30 days and can be used once.</p>
      <div class="tickets" id="tickets"></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const cfg = window.QUIZ_CONFIG || {};
  const configured = window.supabase && cfg.SUPABASE_URL && !/YOUR-/.test(cfg.SUPABASE_URL + cfg.SUPABASE_ANON_KEY);
  // Same storage key as the quiz, so a player signed in with Google there is signed in here too.
  const sb = configured ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { storageKey: "ornomart-quiz-player" } }) : null;
  const COUPON_DAYS = 30;
  let mode = null; // "google" or "phone"

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtDate = (d) => new Date(d).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });

  function status(r) {
    if (r.redeemed_at) return "used";
    return Date.now() - new Date(r.created_at).getTime() > COUPON_DAYS * 864e5 ? "expired" : "active";
  }

  function showLookup(msg) {
    $("dashView").hidden = true;
    $("lookupView").hidden = false;
    $("wrap").classList.add("centered");
    $("lookupMsg").textContent = msg || "";
  }

  function render(rows, whoText) {
    $("lookupView").hidden = true;
    $("wrap").classList.remove("centered");
    $("dashView").hidden = false;
    window.scrollTo({ top: 0 });

    const first = rows[0] ? rows[0].name.split(" ")[0] : "";
    $("hello").textContent = first ? "Hello, " + first : "My Coupons";
    $("who").textContent = whoText;
    $("tPlayed").textContent = rows.length;
    $("tBest").textContent = (rows.length ? Math.max(...rows.map((r) => r.score)) : 0) + "/10";
    $("tActive").textContent = rows.filter((r) => status(r) === "active").length;

    if (!rows.length) {
      $("tickets").innerHTML = `<div class="empty"><strong>No quiz entries found.</strong><span class="note">Use the same name and mobile number you entered in the quiz, or play the quiz to win your first coupon.</span><a class="btn btn-primary" href="./">Play the Quiz</a></div>`;
      return;
    }
    const label = { active: "Active", used: "Redeemed", expired: "Expired" };
    $("tickets").innerHTML = rows.map((r, i) => {
      const st = status(r);
      const until = new Date(new Date(r.created_at).getTime() + COUPON_DAYS * 864e5);
      const when = st === "used" ? "Redeemed on " + fmtDate(r.redeemed_at) : st === "expired" ? "Expired on " + fmtDate(until) : "Valid till " + fmtDate(until);
      return `
        <article class="ticket ${st}">
          <div class="off"><strong>${esc(r.discount)}</strong><span>Off</span></div>
          <div class="body">
            <div class="row"><span class="code" id="code${i}">${esc(r.coupon_code)}</span><span class="pill ${st}">${label[st]}</span></div>
            <span class="meta">Off on diamond price &amp; making charges · ${esc(when)}</span>
            <span class="meta">Quiz on ${esc(fmtDate(r.created_at))} · Score ${r.score}/${r.total}${r.timed_out ? " · Time ran out" : ""}</span>
            ${st === "active" ? `<div><button type="button" class="btn btn-ghost btn-small" data-copy="${i}">Copy Code</button></div>` : ""}
          </div>
        </article>`;
    }).join("");
  }

  $("tickets").addEventListener("click", (e) => {
    const b = e.target.closest("[data-copy]");
    if (!b) return;
    const el = $("code" + b.dataset.copy);
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(el);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      b.textContent = "Code selected";
    };
    try { navigator.clipboard.writeText(el.textContent).then(() => { b.textContent = "Copied"; }, fallback); } catch (_) { fallback(); }
  });

  // Mobile + email lookup
  $("phone").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 10); });
  $("lookupForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!sb) return;
    const phone = $("phone").value.trim(), name = $("name").value.trim();
    if (name.length < 2) { showLookup("Please enter your name as you entered it in the quiz."); return; }
    if (!/^[6-9]\d{9}$/.test(phone)) { showLookup("Please enter your 10-digit mobile number."); return; }
    $("lookupBtn").disabled = true;
    const { data, error } = await sb.rpc("get_my_quiz_entries", { p_phone: phone, p_name: name });
    $("lookupBtn").disabled = false;
    if (error) { showLookup("Could not load your coupons. Please try again."); return; }
    mode = "phone";
    try { sessionStorage.setItem("ornomart-my", JSON.stringify({ phone, name })); } catch (_) {}
    render(data, "Mobile " + phone);
  });

  // Google
  async function loadGoogle(user) {
    const { data, error } = await sb.rpc("get_my_quiz_entries", {});
    if (error) { showLookup("Could not load your coupons. Please try again."); return; }
    mode = "google";
    render(data, "Signed in with Google · " + user.email);
  }

  $("exitBtn").addEventListener("click", async () => {
    if (mode === "google") await sb.auth.signOut();
    try { sessionStorage.removeItem("ornomart-my"); } catch (_) {}
    $("phone").value = ""; $("name").value = "";
    mode = null;
    showLookup("");
  });

  if (!sb) { showLookup("This page is not set up yet."); $("lookupBtn").disabled = true; return; }

  // Prefill from the quiz just played on this device (kept only for this browser tab).
  try {
    const saved = JSON.parse(sessionStorage.getItem("ornomart-my") || "null");
    if (saved) { $("phone").value = saved.phone || ""; $("name").value = saved.name || ""; }
  } catch (_) {}

  fetch(cfg.SUPABASE_URL + "/auth/v1/settings", { headers: { apikey: cfg.SUPABASE_ANON_KEY } })
    .then((r) => r.json()).then((j) => { $("googleBox").hidden = !(j.external && j.external.google); }).catch(() => {});

  $("googleBtn").addEventListener("click", async () => {
    $("googleBtn").disabled = true;
    const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } });
    if (error) { $("googleBtn").disabled = false; showLookup("Google sign-in is not available right now. Use your mobile and email instead."); }
  });

  sb.auth.onAuthStateChange((event, session) => {
    if (location.hash.includes("access_token")) history.replaceState(null, "", location.pathname);
    if (session && (event === "INITIAL_SESSION" || event === "SIGNED_IN")) setTimeout(() => loadGoogle(session.user), 0);
  });
})();
</script>
</body>
</html>
